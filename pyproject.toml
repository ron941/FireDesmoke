[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firedesmoke-release"
version = "0.1.0"
description = "FireDesmoke image restoration inference and demo"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy==2.2.6", "Pillow==11.3.0", "einops==0.8.2", "opencv-python-headless==4.12.0.88"]

[project.optional-dependencies]
model = ["torch==2.7.1", "torchvision==0.22.1"]
demo = ["gradio==5.49.1"]
test = ["pytest==8.4.2"]
conversion = ["safetensors==0.8.0"]

[project.scripts]
firedesmoke = "firedesmoke.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
